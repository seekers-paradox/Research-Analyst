<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Analyst</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Research Analyst</h1>
    <p>Enter four details. We research the business and its nearby competitors, then write a short onboarding report for the AI Receptionist, AI Social Media, and AI Blogger that the client can review.</p>
  </header>

  <main>
    <form id="intake" novalidate>
      <section>
        <div class="grid">
          <label>Business name<input name="businessName" required autocomplete="organization"></label>
          <label>Website<input name="website" required placeholder="example.com" inputmode="url"></label>
          <label>Business category<input name="category" required list="categories" placeholder="e.g. Dental clinic"></label>
          <label>City<input name="city" required placeholder="e.g. Kansas City, MO" autocomplete="address-level2"></label>
        </div>
        <datalist id="categories">
          <option>Restaurant</option><option>Retail store</option><option>Dental clinic</option>
          <option>Medical practice</option><option>Salon / Spa</option><option>Fitness studio</option>
          <option>Real estate agency</option><option>Law firm</option><option>Accounting firm</option>
          <option>Home builder</option><option>Plumber</option><option>HVAC contractor</option>
          <option>Roofing contractor</option><option>Auto repair shop</option><option>Veterinary clinic</option>
          <option>Insurance agency</option><option>Marketing agency</option><option>Hotel</option>
        </datalist>
        <label id="access-code-field" class="access" hidden>Access code<input name="accessCode" type="password" autocomplete="current-password"></label>
        <ul id="form-errors" class="errors" hidden></ul>
        <div class="actions-row">
          <button type="submit" id="submit">Research &amp; create report</button>
          <span class="hint">Takes about 1–3 minutes. Keep this tab open.</span>
        </div>
      </section>
    </form>

    <section id="progress" hidden>
      <h2 id="phase">Starting…</h2>
      <div class="bar"><div id="bar-fill"></div></div>
      <ol id="log"></ol>
    </section>

    <section id="output" hidden>
      <div class="toolbar">
        <button type="button" id="edit" disabled>Edit report</button>
        <button type="button" id="download" disabled>Download Markdown</button>
        <button type="button" id="print" disabled>Print / Save as PDF</button>
        <span class="spacer"></span>
        <button type="button" id="restart">New report</button>
      </div>
      <textarea id="editor" hidden spellcheck="true" aria-label="Edit report (Markdown)"></textarea>
      <article id="report" class="markdown"></article>
    </section>
  </main>

  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
